services:
  - type: web
    name: near-kart-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: near-kart-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        value: ''
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OTP_PROVIDER_NAME
        value: 2factor
      - key: OTP_PROVIDER_API_KEY
        sync: false
      - key: OTP_PROVIDER_TEMPLATE_NAME
        sync: false
      - key: OTP_PROVIDER_ALLOW_INSECURE_TLS
        value: false
      - key: OTP_DEV_PREVIEW_ENABLED
        value: true

databases:
  - name: near-kart-db
    databaseName: near_kart
    user: near_kart
